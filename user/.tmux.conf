
# ==========================================
# Terminal and true color
# ==========================================

set -s default-terminal "tmux-256color"

# Advertise RGB support to tmux
set -as terminal-features ",alacritty:RGB"

set -s theme dark

# Clipboard integration
set -s set-clipboard external

# Terminal focus events
set -s focus-events on


# ==========================================
# General settings
# ==========================================

# Start windows and panes at 1
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Performance and responsiveness
set -sg escape-time 10
set -g repeat-time 500

# Scrollback history
set -g history-limit 100000

# Mouse support
set -g mouse on

# Vim-style copy mode
setw -g mode-keys vi


# ==========================================
# Prefix keys
# ==========================================

unbind C-b

set -g prefix M-Space
set -g prefix2 M-a

# ==========================================
# Copy and paste
# ==========================================

unbind [
unbind ]
unbind f
unbind g

# Enter copy mode
bind-key k copy-mode

# Paste buffer
bind-key g paste-buffer

# Vim-style selection and copying
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi y send -X copy-selection-and-cancel

# Cancel copy mode with Escape
bind-key -T copy-mode-vi Escape send -X cancel


# ==========================================
# Pane navigation
# ==========================================

# Alt + Vim keys
bind-key -n M-h select-pane -L
bind-key -n M-l select-pane -R
bind-key -n M-k select-pane -U
bind-key -n M-j select-pane -D


# ==========================================
# Pane splitting
# ==========================================

# Vertical split (top/bottom)
bind-key v split-window -v -c "#{pane_current_path}"

# Horizontal split (left/right)
bind-key h split-window -h -c "#{pane_current_path}"


# ==========================================
# Window management
# ==========================================

# Preserve current working directory when creating windows
bind-key c new-window -c "#{pane_current_path}"

# Reload configuration
bind-key r source-file ~/.tmux.conf \; \
    display-message "tmux.conf reloaded."


# ==========================================
# Appearance
# ==========================================

# Status bar
set -g status on
set -g status-position bottom
set -g status-justify left
set -g status-interval 5

set -g status-style "bg=#32302F,fg=#FFFFFF"

## Window names
set -g window-status-separator ""
set -g window-status-format "#[nounderscore,nobold,fg=#928374,bg=#32302F] #I:#[fg=#BDAE93]#W "
set -g window-status-current-format "#[nounderscore,bold,fg=#282828,bg=#FABD2F] #I:#W "

## Pane borders
set -g pane-border-style "fg=#504945"

## Status bar content
set -g status-left-length 30
set -g status-right-length 50
set -g status-left "#[fg=yellow,bold] #S "
set -g status-right "#[fg=gray] %d.%m. %H:%M "

set -g pane-border-status top
set -g pane-border-format '#[fg=#928374] #[fg=#FABD2F]#{pane_current_command} '
set -g pane-border-style "fg=#504945"
set -g pane-active-border-style "fg=#FABD2F"

# ==========================================
# More
# ==========================================

## Floating file search - horizontal split
#bind-key -n M-s display-popup
bind-key f display-popup \
    -E -w 80% -h 70% \
    -d "#{pane_current_path}" \
    "~/.local/bin/tmux-fzf-files split"

## Floating file search - new window
#bind-key -n M-n display-popup \
#    -E -w 80% -h 70% \
#    -d "#{pane_current_path}" \
#    "~/.local/bin/tmux-fzf-files window"

## Select destination window/pane and join current pane into it
bind-key j choose-tree -Zw 'join-pane -t "%%"'
