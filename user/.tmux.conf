
# ==========================================
# Terminal and true color
# ==========================================

set -s default-terminal "tmux-256color"

# Advertise RGB support to tmux
set -as terminal-features ",xterm-ghostty:RGB"

set -s theme dark

# Clipboard integration
set -s set-clipboard external

# Terminal focus events
set -s focus-events on


# ==========================================
# General settings
# ==========================================

# Start windows and panes at 1
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Performance and responsiveness
set -sg escape-time 10
set -g repeat-time 500

# Scrollback history
set -g history-limit 100000

# Mouse support
set -g mouse on

# Vim-style copy mode
setw -g mode-keys vi


# ==========================================
# Prefix keys
# ==========================================

unbind C-b

set -g prefix M-Space
set -g prefix2 M-a

# ==========================================
# Copy and paste
# ==========================================

unbind [
unbind ]
unbind f
unbind g

# Enter copy mode
bind f copy-mode

# Paste buffer
bind g paste-buffer

# Vim-style selection and copying
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# Cancel copy mode with Escape
bind -T copy-mode-vi Escape send -X cancel


# ==========================================
# Pane navigation
# ==========================================

# Alt + Vim keys
bind -n M-h select-pane -L
bind -n M-l select-pane -R
bind -n M-k select-pane -U
bind -n M-j select-pane -D


# ==========================================
# Pane splitting
# ==========================================

# Vertical split (top/bottom)
bind-key v split-window -v -c "#{pane_current_path}"

# Horizontal split (left/right)
bind-key h split-window -h -c "#{pane_current_path}"


# ==========================================
# Window management
# ==========================================

# Preserve current working directory when creating windows
bind c new-window -c "#{pane_current_path}"

# Reload configuration
bind-key r source-file ~/.tmux.conf \; \
    display-message "tmux.conf reloaded."


# ==========================================
# Appearance
# ==========================================

# Status bar
set -g status on
set -g status-position bottom
set -g status-justify left
set -g status-interval 5

set -g status-style "bg=#32302F,fg=#FFFFFF"

## Window names
set -g window-status-separator ""
set -g window-status-format "#[nounderscore,nobold,fg=#928374,bg=#32302F] #I:#[fg=#BDAE93]#W "
set -g window-status-current-format "#[nounderscore,bold,fg=#282828,bg=#FABD2F] #I:#W "

## Pane borders
set -g pane-border-style "fg=#504945"

## Status bar content
set -g status-left-length 30
set -g status-right-length 50
set -g status-left "#[fg=yellow,bold] #S "
set -g status-right "#[fg=gray] %d.%m. %H:%M "

set -g pane-border-status top
set -g pane-border-format \
    '#[fg=#928374] #P #[fg=#FABD2F]#{pane_current_command} '
